name: Publish scheduled Instagram posts
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      check:
        description: "Only check the token (prints account)"
        type: boolean
        default: false
      test_id:
        description: "Dry run: build the container for this schedule id, do not publish"
        type: string
        default: ""
permissions:
  contents: write
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: instagram
    steps:
      - uses: actions/checkout@v4
      - name: Publish due posts
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TEST_ID: ${{ inputs.test_id }}
        run: |
          if [ -n "$TEST_ID" ]; then
            python3 scripts/publish.py --test "$TEST_ID"
          else
            python3 scripts/publish.py ${{ inputs.check && '--check' || '' }}
          fi
      - name: Record published posts
        if: always()
        run: |
          if [ -n "$(git status --porcelain published.json)" ]; then
            git config user.name "aviationfacts-bot"
            git config user.email "aviationfacts-bot@users.noreply.github.com"
            git add published.json && git commit -m "Record published posts" && git pull --rebase -q origin main && git push origin HEAD:main
          fi
